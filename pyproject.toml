# Existe pro `uv run`. O GitHub Actions usa o requirements*.txt com pip —
# mantenha os dois em sincronia.
[project]
name = "projet-tony-parker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "tzdata; platform_system == 'Windows'",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test_projet.py"]
